name: Lint with Ruff

# turing-labs-hq fork: runs on `pull_request`, never `pull_request_target`. Upstream used
# pull_request_target to lint outside contributors' PRs without approval; this fork deploys into
# Turing's loop, so no workflow runs in the base context for a PR (see FORK.md). The job keeps
# upstream's hardening: read-only permissions, no secrets, ruff never executes the code.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded lint runs on the same PR/branch to save runner time now that
# every fork push triggers a run automatically.
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      # Install tooling BEFORE checking out untrusted PR code (see SECURITY note).
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Install Ruff
        # Pin to the version locked in uv.lock so this job matches what
        # `make lint` / `make format` produce locally. Bump in lockstep with
        # uv.lock when ruff is upgraded.
        run: uv tool install "ruff==0.14.11"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Ruff linting
        run: uv tool run ruff check --output-format=github
      - name: Run Ruff format check
        run: uv tool run ruff format --check
